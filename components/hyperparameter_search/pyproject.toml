[project]
name = "hyperparameter_search"
version = "0.1.0"
description = "Templated hyperparameter search component."
requires-python = ">=3.12,<3.13"
dependencies = [
    "custom-modelling",
    "physicsx-quark>=0.2.1,<0.3.0",
    "physicsx-pxc[hyperparameter_search]>=0.31.1,<0.32.0",
    "physicsx-samples>=0.11.0,<0.12.0",
]

[project.entry-points.quark]
hyperparameter_search = "hyperparameter_search.component:hyperparameter_search"

[[tool.uv.index]]
name = "physicsx"
url = "https://physicsx.jfrog.io/artifactory/api/pypi/px-pypi-release/simple"
authenticate = "always"

[tool.uv.sources]
custom-modelling = { path = "../../libraries/custom_modelling", editable = true }

# Issue with uv setup and prerelease versions of dependencies have been reported:
# https://physicsx.slack.com/archives/C06HMDBQ71N/p1762014165203349
# https://github.com/PhysicsXLtd/product/issues/5610
[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
    "pillow>=12.1.1"
]

[tool.flux.component]
image = "components:hyperparameter_search-0.1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
