[project]
name = "preprocessing"
version = "1.2.0"
description = "Templated Preprocessing component."
requires-python = ">=3.12,<3.13"
dependencies = [
    "custom-layers",
    "physicsx-quark>=0.2.1,<0.3.0",
    "physicsx-pxc[experimental,preprocessing]>=0.28.0,<0.29.0",
    "physicsx-pxd[experimental,filesystems,legacy-samples]>=0.20.0.dev3,<0.21",
    "physicsx-samples>=0.10,<0.11",
    "vtk<9.4",
    "jupyter>=1.1.1",
    "seaborn",
]

[project.entry-points.quark]
preprocessing = "preprocessing.component:preprocessing"

[[tool.uv.index]]
name = "physicsx"
url = "https://physicsx.jfrog.io/artifactory/api/pypi/pypi/simple"
authenticate = "always"

# Local path sources allow you to use packages from the libraries/ directory in your project.
# This enables development of shared code without needing to publish to PyPI.
[tool.uv.sources]
custom-layers = { path = "../../libraries/layers", editable = true }

# Issue with uv setup and prerelease versions of dependencies have been reported:
# https://physicsx.slack.com/archives/C06HMDBQ71N/p1762014165203349
# https://github.com/PhysicsXLtd/product/issues/5610
[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["pillow>=12.1.1"]

[tool.flux.component]
image = "physicsx/prod-ml-us-east-1-14-atlntis-us-prod/components:preprocessing-1.2.0"
input_artifacts = ["samples"]
output_artifacts = ["preprocessed_samples"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
