[project]
name = "optimization"
version = "1.2.0"
description = "Simple Optimization Component."
requires-python = ">=3.12,<3.13"
dependencies = [
    "custom-layers",
    "custom-modelling",
    "physicsx-quark>=0.2.1,<0.3.0",
    "physicsx-pxc[preprocessing,modelling,optimization]>=0.31.1,<0.32.0",
    "physicsx-pxd[experimental,filesystems,legacy-samples]>=0.20.1,<0.21.0",
    "physicsx-samples>=0.11.0,<0.12.0",
]

[project.entry-points.quark]
optimization = "optimization.component:optimization"

[[tool.uv.index]]
name = "physicsx"
url = "https://physicsx.jfrog.io/artifactory/api/pypi/pypi/simple"
authenticate = "always"

[tool.uv.sources]
custom-layers = { path = "../../libraries/layers", editable = true }
custom-modelling = { path = "../../libraries/custom_modelling", editable = true }

# Issue with uv setup and prerelease versions of dependencies have been reported:
# https://physicsx.slack.com/archives/C06HMDBQ71N/p1762014165203349
# https://github.com/PhysicsXLtd/product/issues/5610
[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = ["pillow>=12.1.1"]

[tool.flux.component]
image = "components:optimization-1.2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"