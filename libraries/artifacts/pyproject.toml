[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_artifacts"]

[project]
name = "custom-artifacts"
version = "0.0.1"
description = "Artifact configurations for battery project."
requires-python = ">=3.10,<3.13"
license = {text = "PROPRIETARY"}
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "physicsx-pxc[evaluation]>=0.31.1,<0.32.0",
    "physicsx-pxd>=0.20.1",
    "physicsx-samples>=0.11.0",
]

[[tool.uv.index]]
name = "physicsx"
url = "https://physicsx.jfrog.io/artifactory/api/pypi/px-pypi-release/simple"


[tool.uv.sources]
"physicsx.pxc" = { index = "physicsx"}
"physicsx.pxd" = { index = "physicsx"}
"physicsx-samples" = { index = "physicsx"}
